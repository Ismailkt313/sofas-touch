<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sts-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b291c" />
      <stop offset="60%" stop-color="#241810" />
      <stop offset="100%" stop-color="#180f0a" />
    </linearGradient>
    <linearGradient id="sts-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeedb" />
      <stop offset="50%" stop-color="#dfc593" />
      <stop offset="100%" stop-color="#c89d68" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <style>
    :root { color-scheme: light dark; }
    .bg-plate { fill: url(#sts-bg); }
    .border-stroke { stroke: url(#sts-gold); stroke-opacity: 0.65; }
    @media (prefers-color-scheme: light) {
      .border-stroke { stroke-opacity: 0.9; }
    }
  </style>
  <!-- Background Badge: ensures high-contrast visibility against light/dark tabs -->
  <rect class="bg-plate" x="2" y="2" width="60" height="60" rx="14" filter="url(#soft-glow)" />
  <rect class="border-stroke" x="3" y="3" width="58" height="58" rx="13" fill="none" stroke-width="1.75" />
  
  <!-- Scaled Soft Touch Sofas Emblem (from 32x32 centered into 64x64, scale 1.6, offset x=6.4, y=6.4) -->
  <g transform="translate(6.4, 6.4) scale(1.6)">
    <!-- Sofa Backrest Cushion -->
    <path
      d="M7 13.5C7 10.4624 9.46243 8 12.5 8H19.5C22.5376 8 25 10.4624 25 13.5V16H7V13.5Z"
      fill="#faf7f2"
      fill-opacity="0.22"
      stroke="#faf7f2"
      stroke-width="1.75"
      stroke-linejoin="round"
    />
    <!-- Sofa Arms & Deep Seat Cushion -->
    <path
      d="M4.5 16.5C4.5 15.3954 5.39543 14.5 6.5 14.5C7.60457 14.5 8.5 15.3954 8.5 16.5V19.5H23.5V16.5C23.5 15.3954 24.3954 14.5 25.5 14.5C26.6046 14.5 27.5 15.3954 27.5 16.5V21C27.5 21.8284 26.8284 22.5 26 22.5H6C5.17157 22.5 4.5 21.8284 4.5 21V16.5Z"
      fill="#faf7f2"
      fill-opacity="0.32"
      stroke="#faf7f2"
      stroke-width="1.75"
      stroke-linejoin="round"
    />
    <!-- Golden Walnut Legs -->
    <path
      d="M7.5 22.5V25.2M24.5 22.5V25.2"
      stroke="url(#sts-gold)"
      stroke-width="2"
      stroke-linecap="round"
    />
  </g>
</svg>